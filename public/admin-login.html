<!DOCTYPE html><html lang="tg"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Воридшавӣ — MUSO SHOP</title>
<style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at top,#32104b,#090510 60%);color:white;font-family:Arial}.box{width:min(390px,calc(100% - 40px));padding:28px;background:#160d22;border:1px solid #8a32b7;border-radius:18px;box-shadow:0 0 30px #45006a}h1{font-size:25px}span{color:#d18aff}label{display:block;margin:16px 0 7px}input{width:100%;box-sizing:border-box;padding:13px;border:1px solid #69318a;border-radius:9px;background:#090510;color:white;font-size:16px}button{width:100%;margin-top:18px;padding:13px;border:0;border-radius:10px;background:linear-gradient(90deg,#9a00ed,#5700c8);color:white;font-weight:bold;font-size:16px;cursor:pointer}.msg{color:#ff9da9;min-height:20px}.hint{font-size:13px;color:#c7b7d3;line-height:1.5}</style></head><body><main class="box"><h1>👑 MUSO <span>SHOP</span></h1><p>Панели администратор</p><form id="login"><label>Логин</label><input name="username" autocomplete="username" required><label>Парол</label><input name="password" type="password" autocomplete="current-password" required><button>Ворид шудан</button></form><p class="msg" id="msg"></p><p class="hint">Маълумоти воридшавӣ дар сервер санҷида мешавад.</p><a href="/" style="color:#d18aff">← Ба сайти асосӣ</a></main><script>
document.getElementById('login').addEventListener('submit',async e=>{e.preventDefault();let f=new FormData(e.target);let r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:f.get('username'),password:f.get('password')})});let d=await r.json();if(r.ok)location.href='/admin';else document.getElementById('msg').textContent=d.error||'Воридшавӣ нашуд'});
</script></body></html>
